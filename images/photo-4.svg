    <circle cx="38" cy="-25" r="5" fill="#d4556b" opacity="0.2"/>
  </g>
  <text x="200" y="390" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#d4556b" opacity="0.6">Making Memories</text>
  <text x="200" y="420" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#b8384f" opacity="0.4">Replace with your photo</text>
