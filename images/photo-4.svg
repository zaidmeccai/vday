<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg4" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf6f0"/>
      <stop offset="100%" style="stop-color:#f9e4e8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg4)" rx="8"/>
  <!-- Camera / memories icon -->
  <g transform="translate(200,220)">
    <rect x="-60" y="-40" width="120" height="80" rx="12" fill="none" stroke="#d4556b" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#d4556b" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="18" fill="#d4556b" opacity="0.15"/>
    <rect x="-15" y="-50" width="30" height="15" rx="5" fill="none" stroke="#d4556b" stroke-width="2" opacity="0.3"/>
