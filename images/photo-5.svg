  <rect x="220" y="130" width="12" height="12" rx="2" fill="#d4556b" opacity="0.15" transform="rotate(30 226 136)"/>
  <rect x="140" y="200" width="10" height="10" rx="2" fill="#d4a574" opacity="0.2" transform="rotate(-20 145 205)"/>
  <rect x="260" y="240" width="14" height="14" rx="2" fill="#d4556b" opacity="0.12" transform="rotate(45 267 247)"/>
