  <text x="200" y="400" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#d4556b" opacity="0.6">Laughter &amp; Joy</text>
  <text x="200" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#b8384f" opacity="0.4">Replace with your photo</text>
