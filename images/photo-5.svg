      <stop offset="0%" style="stop-color:#e8768a"/>
      <stop offset="50%" style="stop-color:#f9e4e8"/>
      <stop offset="100%" style="stop-color:#fef0f3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg5)" rx="8"/>
  <!-- Confetti / celebration shapes -->
  <circle cx="120" cy="150" r="8" fill="#d4556b" opacity="0.2"/>
  <circle cx="280" cy="180" r="6" fill="#d4a574" opacity="0.25"/>
